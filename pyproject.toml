[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asym"
version = "0.1.0"
description = "Modelling asymmetric interpersonal relationship dynamics with heterogeneous multi-agent systems"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "sympy>=1.13", "pyyaml>=6.0", "networkx>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["asym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: statistical / ensemble tests"]
