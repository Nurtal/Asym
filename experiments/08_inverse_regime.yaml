name: inverse_regime
description: >
  Tamarit et al. (2018) predict an inverse regime, with the inner layers the most
  populated, when resources per available alter are high. This experiment uses the
  calibrated population of experiment 06. Resources per alter are raised in two ways:
  by shrinking the population (N = 8 … 100) and by scaling the budget at N = 48
  (x0.5 … x4). The layer_regime analysis fits n_k ∝ exp(−μ·cost_k) to the
  non-cumulative layer counts; μ < 0 is the inverse regime.
base:
  archetypes:
    butterfly_c: {base: butterfly, B: 20.0, beta: 0.6, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    loyal_few_c: {base: loyal_few, B: 10.0, beta: 3.0, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    transactional_c: {base: transactional, B: 12.5, beta: 1.2, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    avoidant_c: {base: avoidant, B: 12.5, beta: 1.2, delta: [0.045, 0.0332, 0.0226, 0.0135]}
  population:
    composition: {butterfly_c: 0.25, loyal_few_c: 0.25, transactional_c: 0.25, avoidant_c: 0.25}
    size: 100
    noise: 0.15
    seed: 0
  globals:
    gamma: 0.85
    a0: 0.5
    eta: 0.09
    thresholds: [0.31, 0.60, 0.82]
  init: {mode: empty}
  variants: {exploration: ties}
  simulation:
    horizon: 1500.0
    burn_in: 1000.0
    sample_interval: 25.0
    record_events: false
seeds: {range: [0, 5]}
conditions:
  n8:
    population:
      size: 8
  n12:
    population:
      size: 12
  n16:
    population:
      size: 16
  n24:
    population:
      size: 24
  n32:
    population:
      size: 32
  n48:
    population:
      size: 48
  n100:
    population:
      size: 100
  n48_B0p5x:
    population:
      size: 48
    archetypes:
      butterfly_c:
        B: 10.0
      loyal_few_c:
        B: 5.0
      transactional_c:
        B: 6.25
      avoidant_c:
        B: 6.25
  n48_B2x:
    population:
      size: 48
    archetypes:
      butterfly_c:
        B: 40.0
      loyal_few_c:
        B: 20.0
      transactional_c:
        B: 25.0
      avoidant_c:
        B: 25.0
  n48_B4x:
    population:
      size: 48
    archetypes:
      butterfly_c:
        B: 80.0
      loyal_few_c:
        B: 40.0
      transactional_c:
        B: 50.0
      avoidant_c:
        B: 50.0
analysis: [layering, layering_by_archetype, layer_regime]
