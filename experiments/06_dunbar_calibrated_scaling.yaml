name: dunbar_calibrated_scaling
description: >
  Experiment 05 recalibrated: circle thresholds [0.31, 0.60, 0.82] (calibration in
  docs/experiments/06-dunbar-calibrated-scaling.md) so that the cumulative layers
  have ratios close to 3 with encounter-only tie formation. Checks the calibration
  from an empty start at N = 100, 200 and 400.
base:
  archetypes:
    butterfly_c: {base: butterfly, B: 20.0, beta: 0.6, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    loyal_few_c: {base: loyal_few, B: 10.0, beta: 3.0, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    transactional_c: {base: transactional, B: 12.5, beta: 1.2, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    avoidant_c: {base: avoidant, B: 12.5, beta: 1.2, delta: [0.045, 0.0332, 0.0226, 0.0135]}
  population:
    composition: {butterfly_c: 0.25, loyal_few_c: 0.25, transactional_c: 0.25, avoidant_c: 0.25}
    size: 100
    noise: 0.15
    seed: 0
  globals:
    gamma: 0.85
    a0: 0.5
    eta: 0.09
    thresholds: [0.31, 0.60, 0.82]
  init: {mode: empty}
  variants: {exploration: ties}
  simulation:
    horizon: 1500.0
    burn_in: 1000.0
    sample_interval: 25.0
    record_events: false
seeds: {range: [0, 3]}
conditions:
  n100: {population: {size: 100}}
  n200: {population: {size: 200}}
  n400: {population: {size: 400}}
analysis: [layering, layering_by_archetype]
