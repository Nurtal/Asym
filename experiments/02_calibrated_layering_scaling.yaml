name: calibrated_layering_scaling
description: >
  Research question 2 with a calibrated population. The four built-in archetypes are
  rescaled (budget x2.5, decay ladder x0.3 and flattened, concentration x1.2,
  eta 0.09, gamma 0.85) so that the cumulative layers come close to the ~3x Dunbar
  scaling at N=100 (calibration: docs/experiments/02-calibrated-layering-scaling.md).
  The conditions vary the population size N to separate layers bounded by the
  agent's budget (expected independent of N) from layers bounded by exposure to
  new people (expected to grow with N).
base:
  archetypes:
    butterfly_c: {base: butterfly, B: 20.0, beta: 0.6, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    loyal_few_c: {base: loyal_few, B: 10.0, beta: 3.0, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    transactional_c: {base: transactional, B: 12.5, beta: 1.2, delta: [0.024, 0.0169, 0.0115, 0.0068]}
    avoidant_c: {base: avoidant, B: 12.5, beta: 1.2, delta: [0.045, 0.0332, 0.0226, 0.0135]}
  population:
    composition: {butterfly_c: 0.25, loyal_few_c: 0.25, transactional_c: 0.25, avoidant_c: 0.25}
    size: 100
    noise: 0.15
    seed: 0
  globals:
    gamma: 0.85
    a0: 0.5
    eta: 0.09
  init: {mode: empty}
  simulation:
    horizon: 600.0
    burn_in: 300.0
    sample_interval: 20.0
    record_events: false
seeds: {range: [0, 5]}
conditions:
  n100: {population: {size: 100}}
  n200: {population: {size: 200}}
  n400: {population: {size: 400}}
analysis: [layering, layering_by_archetype]
